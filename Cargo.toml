[workspace]
members = [
    "crates/dear-diary",
    "crates/dear-diary-config",
    "crates/dear-diary-embeddings",
    "crates/dear-diary-qdrant",
    "crates/dear-diary-mcp",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
# Edition 2024 requires nightly; see rust-toolchain.toml for the pinned channel.
edition = "2024"
license = "ISC"
repository = "https://github.com/leynos/dear-diary"

[workspace.dependencies]
# Workspace crates
dear-diary-config = { path = "crates/dear-diary-config" }
dear-diary-embeddings = { path = "crates/dear-diary-embeddings" }
dear-diary-qdrant = { path = "crates/dear-diary-qdrant" }
dear-diary-mcp = { path = "crates/dear-diary-mcp" }

# Async runtime
tokio = { version = "1.49", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
ortho_config = "0.6.0"

# MCP
rmcp = { version = "0.12", features = ["server", "transport-io", "macros"] }

# Qdrant
qdrant-client = { version = "1.14", features = ["serde"] }

# JSON Schema
schemars = "1.2"

# Embeddings
fastembed = "4.8"

# Error handling
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# Utilities
uuid = { version = "1.17", features = ["v4"] }

# Testing
dotenvy = "0.15"
insta = { version = "1.45", features = ["json", "redactions"] }
mockall = "0.13"
rstest = "0.26"
rstest-bdd = "0.3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# 1. hygiene
allow_attributes                    = "deny"
allow_attributes_without_reason     = "deny"
blanket_clippy_restriction_lints    = "deny"
cognitive_complexity                = "deny"
needless_pass_by_value              = "deny"
implicit_hasher                     = "deny"

# 2. debugging leftovers
dbg_macro                           = "deny"
print_stdout                        = "deny"
print_stderr                        = "deny"

# 2. panic-prone operations
unwrap_used                         = "deny"
expect_used                         = "deny"
indexing_slicing                    = "deny"
string_slice                        = "deny"
integer_division                    = "deny"
integer_division_remainder_used     = "deny"
panic_in_result_fn                  = "deny"
unreachable                         = "deny"

# 4. portability
host_endian_bytes                   = "deny"
little_endian_bytes                 = "deny"
big_endian_bytes                    = "deny"

# 5. nursery idiom polish
let_underscore_must_use             = "deny"
or_fun_call                         = "deny"
option_if_let_else                  = "deny"
self_named_module_files             = "deny"
shadow_reuse                        = "deny"
shadow_same                         = "deny"
shadow_unrelated                    = "deny"
str_to_string                       = "deny"
string_lit_as_bytes                 = "deny"
try_err                             = "deny"
unneeded_field_pattern              = "deny"
use_self                            = "deny"

# 6. numerical foot-guns
float_arithmetic                    = "deny"
cast_possible_truncation            = "deny"
cast_possible_wrap                  = "deny"
cast_precision_loss                 = "deny"
lossy_float_literal                 = "deny"

# 7. API ergonomics
missing_const_for_fn                = "deny"
must_use_candidate                  = "deny"
unused_async                        = "deny"

# 8. Error handling
missing_panics_doc                  = "deny"
error_impl_error                    = "deny"
result_large_err                    = "deny"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
missing_crate_level_docs = "deny"
