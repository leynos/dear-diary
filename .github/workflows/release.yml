name: Release Binary

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TOML_PATH: crates/dear-diary/Cargo.toml
  PACKAGE_NAME: dear-diary
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: x86_64
            key: linux-x86_64
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: linux
            arch: aarch64
            key: linux-aarch64
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: freebsd
            arch: x86_64
            key: freebsd-x86_64
            target: x86_64-unknown-freebsd
            ext: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Verify tag matches Cargo.toml
        env:
          INPUT_CARGO_TOML_PATH: ${{ env.CARGO_TOML_PATH }}
          INPUT_GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          "${{ steps.setup-python.outputs.python-path }}" --version
          uv run scripts/release_support.py verify-version
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@e0d9b652b137eb15314fff188f09e1ba18d3cc5b
      - name: Install mold linker
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang mold
      - name: Cache cross binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cargo/bin/cross
          key: cross-v0.2.5-${{ runner.os }}
      - name: Install cross
        env:
          RUSTFLAGS: ""
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 88f49ff79e777bef6d3564531636ee4d3cc2f8d2
      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Add release target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: |
          set -euo pipefail
          cross build --release --target ${{ matrix.target }} --package ${{ env.PACKAGE_NAME }} --bin ${{ env.PACKAGE_NAME }}
          echo "metric=release_build_complete target=${{ matrix.target }} os=${{ matrix.os }} arch=${{ matrix.arch }}"
      - name: Stage release artefacts
        id: stage
        uses: leynos/shared-actions/.github/actions/stage-release-artefacts@eff100c965da05e14fd4e07d7ea518408b312cb8
        with:
          config-file: .github/release-staging.toml
          target: ${{ matrix.key }}
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.REPO_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.stage.outputs.artifact-dir }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          generate_release_notes: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
      - run: |
          uploaded_count=0
          for dir in artifacts/${{ env.REPO_NAME }}-*; do
            echo "Uploading release assets from ${dir}"
            for file in "$dir"/*; do
              echo "Uploading ${file}"
              gh release upload "${{ github.ref_name }}" "$file" --clobber
              uploaded_count=$((uploaded_count + 1))
              echo "metric=release_asset_uploaded count=${uploaded_count}"
            done
          done
          echo "Uploaded ${uploaded_count} release assets."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
