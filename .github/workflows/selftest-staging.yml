name: Selftest Release Staging

on:
  pull_request:
    paths:
      - .github/release-staging.toml
      - .github/workflows/selftest-staging.yml
      - conftest.py
      - tests/conftest.py
      - tests/fixtures/selftest.event.json
      - tests/test_release_workflow_dry_run.py
      - tests/test_selftest_stage.py
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stage-only:
    name: Stage artefacts for local validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Create dummy release binary
        run: |
          set -euo pipefail
          binary="target/x86_64-unknown-linux-gnu/release/dear-diary"
          mkdir -p "$(dirname "${binary}")"
          printf 'selftest release binary\n' > "${binary}"
          chmod +x "${binary}"
      - name: Stage release artefacts
        id: stage
        uses: leynos/shared-actions/.github/actions/stage-release-artefacts@455d9ed03477c0026da96c2541ca26569a74acac
        with:
          config-file: .github/release-staging.toml
          target: linux-x86_64
      - name: Emit staging metric
        env:
          ARTIFACT_DIR: ${{ steps.stage.outputs.artifact-dir }}
          STAGED_FILES: ${{ steps.stage.outputs.staged-files }}
        run: |
          set -euo pipefail
          echo "metric=selftest_stage_complete target=linux-x86_64"
          echo "artifact_dir=${ARTIFACT_DIR}"
          echo "staged_files=$(printf '%s' "${STAGED_FILES}" | tr '\n' ' ')"
      - name: Upload staged artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selftest-stage
          path: ${{ steps.stage.outputs.artifact-dir }}
