[package]
name = "dear-diary"
description = "MCP server for Qdrant vector database - semantic memory layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.binstall]

[package.metadata.binstall.overrides.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64"), target_env = "gnu"))']
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
dear-diary-config.workspace = true
dear-diary-embeddings.workspace = true
dear-diary-qdrant.workspace = true
dear-diary-mcp.workspace = true
tokio.workspace = true
rmcp.workspace = true

[dev-dependencies]
dear-diary-qdrant = { workspace = true, features = ["test-utils"] }
dotenvy.workspace = true
insta.workspace = true
mockall.workspace = true
qdrant-client.workspace = true
rstest.workspace = true
rstest-bdd.workspace = true
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true
